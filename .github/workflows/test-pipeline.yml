name: A5 Build-Test-Deploy

on:
  push:
    branches: [ assignment5 ]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: ver
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build
        run: |
          bun install
          bun run build
          zip -r build.zip dist action.yml package.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run unit tests
        run: |
          node --version
          npm run test:unit

  test-integration:
    needs: test-unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test_env: [staging, prod]
    env:
      TEST_ENV: ${{ matrix.test_env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Restore built files over the checkout
        run: unzip -o build.zip

      - name: Run integration tests
        run: npm run test:integration

  report-failure:
    needs: [build, test-unit, test-integration]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue for the failed run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          UNIT_RESULT: ${{ needs.test-unit.result }}
          INTEGRATION_RESULT: ${{ needs.test-integration.result }}
        run: |
          {
            echo "The pipeline failed before any release was created."
            echo ""
            echo "- Branch: $BRANCH"
            echo "- Commit: $SHA"
            echo "- Build: $BUILD_RESULT"
            echo "- Unit tests: $UNIT_RESULT"
            echo "- Integration tests: $INTEGRATION_RESULT"
            echo "- Run: $RUN_URL"
          } > issue.md
          gh issue create --title "Pipeline failure on $BRANCH (run #$RUN_NUMBER)" --body-file issue.md

  deploy-staging:
    needs: [build, test-unit, test-integration]
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Staging Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          TAG="a5-${PREFIX}-v${VERSION}-r${RUN}"
          echo "Unit and integration tests passed. Releasing $TAG"
          gh release create "$TAG" build.zip \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "$NOTE. Released after unit and integration tests passed." \
            --prerelease

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Release Production Build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREFIX: ${{ vars.BUILD_TAG }}
          NOTE: ${{ vars.RELEASE_NOTE }}
          VERSION: ${{ needs.build.outputs.version }}
          RUN: ${{ github.run_number }}
        run: |
          TAG="a5-${PREFIX}-v${VERSION}-r${RUN}"
          echo "Approved by reviewer. Releasing $TAG"
          gh release create "$TAG" build.zip \
            --target "${{ github.sha }}" \
            --title "$TAG" \
            --notes "$NOTE. Released after tests passed and manual approval." \
            --latest=false
